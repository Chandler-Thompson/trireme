# Default model per seat. Each project can override any seat. The harness chosen for a
# seat decides which models are actually available, so these are policies resolved
# against that harness at start, and the resolved model is recorded in the journal.

[default]
policy = "opus-or-equivalent"   # the strongest generally available model of the harness

# The reviewing seat should run on a different model family from the author's wherever
# the harnesses in use make two families available. Where they do not, the fleet records
# the rule as unmet.
[review]
decorrelation = "different-family-when-available"

# Per-seat overrides go here, for example:
# [seats.engine-engineer]
# policy = "opus-or-equivalent"
